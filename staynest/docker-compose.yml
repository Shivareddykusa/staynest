version: '3.8'

services:
  # ─── Tier 3: Database (MySQL) ──────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: staynest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: staynest
      MYSQL_USER: staynest_user
      MYSQL_PASSWORD: staynest_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - staynest-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── Tier 2: Backend (Flask REST API) ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: staynest-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: staynest
      DB_USER: staynest_user
      DB_PASS: staynest_pass
      JWT_SECRET_KEY: staynest-super-secret-jwt-key-2026
      FLASK_ENV: production
      FLASK_DEBUG: 0
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - staynest-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Tier 1: Frontend (Nginx + Static HTML/CSS/JS) ────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: staynest-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - staynest-net

volumes:
  mysql_data:
    driver: local

networks:
  staynest-net:
    driver: bridge
